<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEON STRIKE — 霓虹突袭</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #04050c;
  overflow: hidden;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: #cfe9ff;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#wrap {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 50% 30%, #0a0b1e 0%, #04050c 70%);
}
#game {
  display: block;
  background: #05060f;
  max-width: 100%; max-height: 100%;
  aspect-ratio: 480 / 720;
  height: min(100vh, calc(100vw * 1.5));
  box-shadow: 0 0 40px rgba(60, 120, 255, .25), 0 0 120px rgba(255, 60, 140, .12);
  border: 1px solid #1a2a4a;
  image-rendering: pixelated;
  touch-action: none;
}
#hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  font-size: 13px; color: #5a7099; letter-spacing: 2px;
  pointer-events: none; opacity: .85;
  animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:.35} 50%{opacity:.9} }

</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="480" height="720"></canvas>
    <div id="hint">点击 / 按 任一键 开始</div>
  </div>
  <script>
'use strict';
/* ==== js/config.js ==== */
// config.js —— 全局数值中心。所有可调参数集中于此。
window.NS = window.NS || {};
NS.CONFIG = {
  canvas: { width: 480, height: 720, bgTop: '#05060f', bgBottom: '#0a0b1e' },

  player: {
    radius: 14,
    hitRadius: 4,            // 判定点，极小以强化擦弹
    speed: 240,
    maxHp: 3,
    invincibleTime: 1500,
    pickupRadius: 64,
  },

  ships: {
    red:    { name: '赤焰突袭者', color: '#ff3b6b', startWeapon: 'main_cannon', passive: { speedAfterHit: 1.4, hitInvMs: 1500 }, desc: '平衡 · 受伤后短时加速' },
    blue:   { name: '蓝渊守卫者', color: '#3bd6ff', startWeapon: 'pulse',      passive: { shieldMax: 1, shieldRegenMs: 30000 }, desc: '防御 · 自带一层护盾' },
    gold:   { name: '金辉猎手',   color: '#ffd23b', startWeapon: 'laser',       passive: { critRate: 0.15, critMul: 2.0 }, desc: '高风险 · 暴击率+15%' },
  },

  xp: {
    small: 1, medium: 5, large: 20,
    levelCurve: lv => Math.floor(5 + lv * 3 + Math.pow(lv, 1.5) * 2),
    pickupSpeed: 620,
    pickupAccel: 1400,
  },

  combo: { decayMs: 3000, perKillBonus: 0.05, maxMul: 3 },

  difficulty: {
    spawnIntervalStart: 1200,
    spawnIntervalMin: 230,
    spawnIntervalDecayPerMin: 0.85,
    hpScalePerMin: 1.06,
    damageScalePerMin: 1.03,
  },

  bossSchedule: [180, 360, 540, 720],
  eliteWaveInterval: 60,

  physics: { gridCell: 64 },

  pool: { bullet: 600, particle: 900, enemy: 90 },

  render: { glow: true, glowBlur: 10, stars: 110, starLayers: 3, nebula: 3, vignette: 0.5, scanline: 0.05, trails: true, exhaust: true },

  audio: { master: 0.4, bpm: 112 },

  input: { touchDeadzone: 8 },

  bomb: { clearScreen: true, invincibleMs: 1500, damage: 200 },

  graze: { radius: 12, score: 50, flashMs: 80 },
  hitStop: { onHit: 35, onBossHit: 25, onPlayerHurt: 90 },
  shake: { onExplode: 8, onBossPhase: 16, onBomb: 20, cap: 24, decay: 0.88 },
};
;
/* ==== js/engine/events.js ==== */
// engine/events.js —— 事件总线，发布订阅，解耦系统与实体。
(function (NS) {
  const bus = new Map();
  function on(evt, fn) {
    if (!bus.has(evt)) bus.set(evt, new Set());
    bus.get(evt).add(fn);
    return () => off(evt, fn);
  }
  function off(evt, fn) {
    const s = bus.get(evt);
    if (s) s.delete(fn);
  }
  function emit(evt, payload) {
    const s = bus.get(evt);
    if (s) s.forEach(fn => { try { fn(payload); } catch (e) { console.warn('[event]', evt, e); } });
  }
  function clear() { bus.clear(); }
  NS.Events = { on, off, emit, clear };
})(window.NS = window.NS || {});
;
/* ==== js/engine/pool.js ==== */
// engine/pool.js —— 通用对象池，复用对象避免 GC 卡顿。
(function (NS) {
  class Pool {
    constructor(factory, reset, prealloc = 0) {
      this.factory = factory;
      this.reset = reset || (o => o);
      this.free = [];
      this.active = new Set();
      for (let i = 0; i < prealloc; i++) this.free.push(factory());
    }
    acquire() {
      const o = this.free.pop() || this.factory();
      this.active.add(o);
      return o;
    }
    release(o) {
      if (!this.active.has(o)) return;
      this.active.delete(o);
      this.reset(o);
      this.free.push(o);
    }
    releaseAll() {
      this.active.forEach(o => { this.reset(o); this.free.push(o); });
      this.active.clear();
    }
    forEach(fn) { this.active.forEach(fn); }
    get size() { return this.active.size; }
  }
  NS.Pool = Pool;
})(window.NS = window.NS || {});
;
/* ==== js/engine/storage.js ==== */
// engine/storage.js —— localStorage 封装，含容错。
(function (NS) {
  const KEY = 'neon_strike_save_v1';
  const DEFAULT = {
    highScore: 0,
    bestTime: 0,
    unlocked: { red: true, blue: false, gold: false },
    wins: 0,
    muted: false,
  };
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { ...DEFAULT };
      const o = JSON.parse(raw);
      return { ...DEFAULT, ...o, unlocked: { ...DEFAULT.unlocked, ...(o.unlocked || {}) } };
    } catch (e) { return { ...DEFAULT }; }
  }
  function save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  NS.Storage = { load, save, KEY };
})(window.NS = window.NS || {});
;
/* ==== js/engine/input.js ==== */
// engine/input.js —— 键盘 + 触屏输入。玩家只读不写状态，用 consume 取一次性事件。
(function (NS) {
  const keys = new Set();
  const pressed = new Set();   // 本帧按下（用于一次性事件）
  let touch = { active: false, x: 0, y: 0, startX: 0, startY: 0, lastTap: 0 };

  function onKeyDown(e) {
    if (e.repeat) return;
    keys.add(e.code); pressed.add(e.code);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  }
  function onKeyUp(e) { keys.delete(e.code); }

  function bind(canvas) {
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    const getPos = (t) => {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / r.width, sy = canvas.height / r.height;
      return { x: (t.clientX - r.left) * sx, y: (t.clientY - r.top) * sy };
    };
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0]; const p = getPos(t);
      touch.active = true; touch.x = p.x; touch.y = p.y; touch.startX = p.x; touch.startY = p.y;
      const now = performance.now();
      if (now - touch.lastTap < 280) pressed.add('Space');   // 双击 = 雷
      touch.lastTap = now;
      pressed.add('TouchStart');
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0]; const p = getPos(t);
      touch.x = p.x; touch.y = p.y;
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      touch.active = false;
    }, { passive: false });
  }

  function isDown(code) { return keys.has(code); }
  function consume(code) {
    if (pressed.has(code)) { pressed.delete(code); return true; }
    return false;
  }
  function clearFrame() { pressed.clear(); }
  function unbind() {
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
  }

  // 窗口失焦时清空所有输入，防止 alt-tab / 自动化导致的按键卡死（位置漂移）
  window.addEventListener('blur', () => { keys.clear(); pressed.clear(); touch.active = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { keys.clear(); pressed.clear(); touch.active = false; }
  });

  NS.Input = { bind, isDown, consume, clearFrame, unbind,
    get touch() { return touch; } };
})(window.NS = window.NS || {});
;
/* ==== js/engine/audio.js ==== */
// engine/audio.js —— Web Audio 程序化音频：母线压缩 + 分层合成音效 + 三段式 BGM。无音频文件。
(function (NS) {
  let ctx = null, master = null, muted = false;
  let noiseBuf = null;
  let beatCb = null;
  const throttle = {};          // SFX 限流：name -> 上次播放时刻
  const THROTTLE = { shoot: 40, hit: 25, pickup: 30, graze: 50, kill: 30, explode: 60, select: 60, hurt: 120 };

  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      // 母线：增益 -> 压缩器（胶水感 + 防多音重叠削波）
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 6;
      comp.attack.value = 0.004; comp.release.value = 0.16;
      master = ctx.createGain();
      master.gain.value = (NS.CONFIG.audio && NS.CONFIG.audio.master) || 0.4;
      master.connect(comp); comp.connect(ctx.destination);
      // 复用 2 秒白噪声缓冲
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { ctx = null; return false; }
  }

  function resume() {
    ensure();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (ctx && !bgmTimer) startBgm();   // 首次交互后自动进入当前模式的 BGM
  }
  function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : ((NS.CONFIG.audio && NS.CONFIG.audio.master) || 0.4); }
  function isMuted() { return muted; }
  function setBeat(cb) { beatCb = cb; }

  // ---------- 基础声部 ----------
  function envGain(peak, a, d, t) {
    if (!Number.isFinite(peak) || !Number.isFinite(a) || !Number.isFinite(d) || !Number.isFinite(t)) return null;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    return g;
  }

  // tone: 频率/波形/峰值/攻/释/滑音/起始时刻/音高抖动/低通
  function tone(freq, type, peak, a, d, glide, when, jitter, lp) {
    if (!Number.isFinite(freq) || !Number.isFinite(peak)) return;
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type;
    const f = Math.max(20, freq * (1 + (Math.random() * 2 - 1) * (jitter || 0)));
    o.frequency.setValueAtTime(f, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, glide), t + a + d);
    const g = envGain(peak, a, d, t);
    if (!g) return;
    let head = o;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); head = fl; }
    head.connect(g); g.connect(master);
    o.start(t); o.stop(t + a + d + 0.03);
  }

  // noise: 峰值/攻/释/{freq, sweepTo, type, q, rate}
  function noise(peak, a, d, opts, when) {
    opts = opts || {};
    if (!Number.isFinite(peak) || !Number.isFinite(a) || !Number.isFinite(d)) return;
    const t = when || ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = opts.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = opts.type || 'bandpass';
    f.frequency.setValueAtTime(opts.freq || 800, t);
    if (opts.sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(30, opts.sweepTo), t + a + d);
    f.Q.value = opts.q || 0.8;
    const g = envGain(peak, a, d, t);
    if (!g) return;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + a + d + 0.03);
  }

  // ---------- 音效字典（分层 + 抖动，拒绝"机关枪味"） ----------
  const SFX = {
    shoot: () => { tone(560, 'square', 0.09, 0.002, 0.06, 300, 0, 0.05); noise(0.05, 0.001, 0.03, { freq: 3200, q: 1.5 }); },
    shootLaser: () => { tone(180, 'sawtooth', 0.11, 0.02, 0.16, 430, 0, 0.03, 1600); tone(360, 'sine', 0.05, 0.02, 0.12, 720); },
    hit: () => { tone(300 + Math.random() * 70, 'square', 0.08, 0.002, 0.045, 160, 0, 0.04); noise(0.05, 0.001, 0.03, { freq: 1800 }); },
    kill: () => { noise(0.16, 0.003, 0.15, { freq: 900, sweepTo: 240 }); tone(520, 'square', 0.09, 0.002, 0.09, 130, 0, 0.05); },
    explode: () => { noise(0.28, 0.005, 0.32, { freq: 1400, sweepTo: 110, type: 'lowpass' }); tone(110, 'sine', 0.28, 0.008, 0.30, 38); tone(230, 'sawtooth', 0.09, 0.005, 0.12, 60); },
    bossExplode: () => {
      noise(0.36, 0.012, 0.8, { freq: 900, sweepTo: 55, type: 'lowpass' });
      tone(80, 'sine', 0.36, 0.02, 0.75, 28);
      for (let i = 0; i < 3; i++) setTimeout(() => { if (!ctx) return; noise(0.14, 0.004, 0.22, { freq: 600 - i * 140, sweepTo: 80, type: 'lowpass' }); }, i * 130);
    },
    levelup: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 'triangle', 0.18, 0.01, 0.22, 0, ctx.currentTime + i * 0.08)); },
    pickup: () => { tone(880, 'triangle', 0.12, 0.003, 0.06, 1320, 0, 0.04); tone(1760, 'sine', 0.06, 0.002, 0.05, 2200, ctx.currentTime + 0.045); },
    graze: () => tone(1500, 'sine', 0.08, 0.002, 0.05, 2400, 0, 0.06),
    hurt: () => { tone(190, 'sawtooth', 0.26, 0.008, 0.24, 62, 0, 0.03, 900); noise(0.18, 0.008, 0.16, { freq: 420, sweepTo: 120 }); tone(60, 'sine', 0.24, 0.005, 0.2, 40); },
    bomb: () => { noise(0.4, 0.006, 0.5, { freq: 1200, sweepTo: 70, type: 'lowpass' }); tone(70, 'sine', 0.38, 0.015, 0.5, 26); tone(1400, 'sawtooth', 0.10, 0.002, 0.3, 100); },
    bossWarn: () => { for (let i = 0; i < 3; i++) { const w = ctx.currentTime + i * 0.34; tone(466, 'square', 0.16, 0.02, 0.22, 0, w, 0.01, 1200); tone(311, 'square', 0.16, 0.02, 0.22, 0, w + 0.12, 0.01, 1200); } },
    evolve: () => { [659, 880, 1109, 1320, 1760].forEach((f, i) => { const w = ctx.currentTime + i * 0.07; tone(f, 'triangle', 0.2, 0.01, 0.24, 0, w); tone(f * 1.007, 'sawtooth', 0.08, 0.01, 0.2, 0, w, 0, 2600); }); },
    select: () => tone(740, 'square', 0.11, 0.004, 0.05, 980, 0, 0.03),
    gameover: () => { [392, 311, 262, 196].forEach((f, i) => { const w = ctx.currentTime + i * 0.17; tone(f, 'sawtooth', 0.2, 0.02, 0.34, 0, w, 0.01, 1100); tone(f / 2, 'triangle', 0.14, 0.02, 0.3, 0, w); }); },
    win: () => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => { const w = ctx.currentTime + i * 0.11; tone(f, 'triangle', 0.2, 0.01, 0.3, 0, w); tone(f * 2, 'sine', 0.08, 0.01, 0.24, 0, w); }); },
    shieldBreak: () => { tone(980, 'sine', 0.16, 0.003, 0.1, 220, 0, 0.02); noise(0.08, 0.002, 0.08, { freq: 2600 }); },
  };

  function play(name) {
    if (!ctx || muted) return;
    const now = performance.now();
    const min = THROTTLE[name];
    if (min && throttle[name] && now - throttle[name] < min) return;
    throttle[name] = now;
    if (SFX[name]) SFX[name]();
  }

  // ---------- BGM：16 步前瞻调度器（menu 氛围 / play 鼓组 / boss 琶音） ----------
  let bgmTimer = null, bgmMode = 'menu', bgmStep = 0, bgmNext = 0;
  const SPB = () => 60 / ((NS.CONFIG.audio && NS.CONFIG.audio.bpm) || 112);   // 每拍秒数
  // A 小调进行：Am F C G
  const PROG = [
    { root: 110.00, chord: [220.00, 261.63, 329.63] },
    { root: 87.31, chord: [174.61, 220.00, 261.63] },
    { root: 130.81, chord: [261.63, 329.63, 392.00] },
    { root: 98.00, chord: [196.00, 246.94, 293.66] },
  ];
  const BASS_PAT = [1, 1, 1.5, 2];   // 根音/根音/五度/高八度 律动

  function kick(t) { tone(150, 'sine', 0.5, 0.002, 0.12, 42, t); noise(0.06, 0.001, 0.02, { freq: 3200, q: 0.7 }, t); }
  function hat(t, peak) { noise(peak, 0.001, 0.03, { type: 'highpass', freq: 6500, q: 0.6 }, t); }
  function bassNote(f, t, d) { tone(f, 'sawtooth', 0.11, 0.008, d, 0, t, 0.01, 320); tone(f / 2, 'sine', 0.09, 0.008, d, 0, t); }
  function padChord(chord, t, dur) {
    chord.forEach(f => { tone(f, 'sawtooth', 0.035, 0.5, dur, 0, t, 0.004, 850); tone(f * 1.004, 'sawtooth', 0.03, 0.5, dur, 0, t, 0.004, 850); });
  }

  function scheduleStep(step, t) {
    const s16 = step % 16, bar = Math.floor(step / 16) % 4;
    const prog = PROG[bar], spb = SPB();
    const mode = bgmMode, combat = mode === 'play' || mode === 'boss';

    // 鼓组：战斗场景
    if (combat) {
      if (s16 % 4 === 0) kick(t);
      if (s16 % 8 === 4) hat(t, 0.07);
      else if (mode === 'boss' && s16 % 2 === 1) hat(t, 0.035);
      if (s16 % 2 === 0) bassNote(prog.root * BASS_PAT[(s16 / 2) % 4], t, spb * 0.42);
      if (mode === 'boss') tone(prog.chord[step % 3] * 2, 'square', 0.045, 0.004, 0.09, 0, t, 0.004, 2600);
    } else {
      // 菜单：氛围垫 + 慢琶音
      if (s16 === 0) padChord(prog.chord, t, spb * 4);
      if (s16 % 8 === 0) bassNote(prog.root / 2, t, spb * 3.4);
      if (s16 % 4 === 2) tone(prog.chord[Math.floor(step / 4) % 3] * 2, 'triangle', 0.04, 0.02, 0.5, 0, t, 0.005, 2000);
    }

    // 节拍脉冲回调（驱动画面），提前用 setTimeout 对齐
    if (s16 % 4 === 0 && beatCb) {
      const delay = Math.max(0, (t - ctx.currentTime) * 1000);
      setTimeout(() => { if (!muted) beatCb(); }, delay);
    }
  }

  function startBgm(mode) {
    if (mode) bgmMode = mode;
    if (!ctx || bgmTimer) return;
    bgmStep = 0; bgmNext = ctx.currentTime + 0.06;
    bgmTimer = setInterval(() => {
      if (!ctx || muted) return;
      if (bgmNext < ctx.currentTime) bgmNext = ctx.currentTime + 0.05;   // 后台节流后重新对齐
      const stepDur = SPB() / 4;
      while (bgmNext < ctx.currentTime + 0.15) {
        scheduleStep(bgmStep, bgmNext);
        bgmStep++; bgmNext += stepDur;
      }
    }, 30);
  }
  function stopBgm() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  NS.Audio = { resume, play, setMuted, isMuted, setBeat, startBgm, stopBgm };
})(window.NS = window.NS || {});
;
/* ==== js/engine/renderer.js ==== */
// engine/renderer.js —— Canvas 渲染器 + DPR 适配 + 震屏 + 后处理（渐晕/扫描线/危险警报/节拍脉冲）。
(function (NS) {
  class Renderer {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.W = NS.CONFIG.canvas.width;
      this.H = NS.CONFIG.canvas.height;
      this.shake = 0;
      this.flash = null;   // {color, ms}
      this.pulse = 0;      // BGM 节拍脉冲
      this.danger = false; // 低血量警报
      this._t = 0;
      this.dpr = 1;
      this._vignette = null; this._scan = null;
      this.resize();
    }
    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.dpr = dpr;
      this.canvas.width = this.W * dpr;
      this.canvas.height = this.H * dpr;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this._vignette = this._makeVignette();
      this._scan = this._makeScanlines();
    }
    // 预渲染渐晕（离屏，避免每帧建渐变）
    _makeVignette() {
      const c = document.createElement('canvas');
      c.width = this.W; c.height = this.H;

// data/upgrades.js —— 升级池规则与权重。武器满级+持有进化被动 → 出现"进化"金卡。
(function (NS) {
  NS.UPGRADE_POOL = {
    weights: {
      weapon_unmaxed: 40,
      evolve_passive: 16,
      passive: 30,
      ship_specific: 14,
    },

    // 生成 3 个不重复升级选项，传入玩家状态
    roll(player) {
      const out = [];
      const used = new Set();
      const tries = 30;
      // 1. 收集所有候选
      const candidates = [];

      // 武器（未满级）
      for (const id in NS.WEAPONS) {
        const w = NS.WEAPONS[id];
        const owned = player.weapons[id];
        if (!owned) {
          candidates.push({ kind: 'weapon_new', id, weight: 40, title: w.name, desc: '获得新武器', icon: 'W', color: w.color });
        } else if (owned.level < w.maxLevel) {
          candidates.push({ kind: 'weapon_up', id, weight: 40, title: w.name, desc: `${w.name} Lv${owned.level}→${owned.level+1}`, icon: '↑', color: w.color });
        } else if (w.evolution) {
          // 检查是否持有进化所需被动
          const req = w.evolution.requires;
          const have = player.passives[req] && player.passives[req].level > 0;
          if (have && !owned.evolved) {
            candidates.push({ kind: 'evolve', id, weight: 30, title: w.evolution.name, desc: `${w.name} → 进化!`, icon: '★', color: '#ffd23b', gold: true });
          }
        }
      }

      // 被动（未满级）
      for (const id in NS.PASSIVES) {
        const p = NS.PASSIVES[id];
        const owned = player.passives[id];
        const lvl = owned ? owned.level : 0;
        if (lvl < p.maxLevel) {
          candidates.push({ kind: 'passive', id, weight: 30, title: p.name, desc: p.desc + (lvl > 0 ? ` (Lv${lvl}→${lvl+1})` : ''), icon: '◆', color: '#8bd6ff' });
        }
      }

      // 若无可选 → 给分数加成
      if (candidates.length === 0) {
        return [
          { kind: 'score', id: 'score', title: '分数加成', desc: '本局分数 +500', icon: '✦', color: '#ffd23b', apply: () => { NS.Events.emit('score.add', 500); } },
          { kind: 'score', id: 'score', title: '分数加成', desc: '本局分数 +500', icon: '✦', color: '#ffd23b', apply: () => { NS.Events.emit('score.add', 500); } },
          { kind: 'score', id: 'score', title: '分数加成', desc: '本局分数 +500', icon: '✦', color: '#ffd23b', apply: () => { NS.Events.emit('score.add', 500); } },
        ];
      }

      // 加权抽取 3 个不重复
      const pool = candidates.slice();
      for (let i = 0; i < 3 && pool.length > 0; i++) {
        let total = 0; for (const c of pool) total += c.weight;
        let r = Math.random() * total;
        let idx = 0;
        for (; idx < pool.length; idx++) { r -= pool[idx].weight; if (r <= 0) break; }
        const picked = pool.splice(Math.min(idx, pool.length - 1), 1)[0];
        out.push(picked);
      }
      return out;
    },

    // 应用一个升级到玩家
    apply(player, choice) {
      if (choice.kind === 'weapon_new') {
        const w = NS.WEAPONS[choice.id];
        player.weapons[choice.id] = { id: choice.id, level: 1, timer: 0, evolved: false };
      } else if (choice.kind === 'weapon_up') {
        player.weapons[choice.id].level++;
      } else if (choice.kind === 'evolve') {
        player.weapons[choice.id].evolved = true;
        player.weapons[choice.id].level = NS.WEAPONS[choice.id].maxLevel;
      } else if (choice.kind === 'passive') {
        if (!player.passives[choice.id]) player.passives[choice.id] = { id: choice.id, level: 0 };
        player.passives[choice.id].level++;
        NS.PASSIVES[choice.id].apply(player);
      } else if (choice.apply) {
        choice.apply();
      }
    },
  };

// ui/MainMenu.js —— 主菜单。Logo + 三机体卡 + 操作说明 + 最高分 + 静音。
(function (NS) {
  const TAU = Math.PI * 2;
  class MainMenu extends NS.Scene {
    constructor(game) { super(game); this.sel = 0; this.t = 0; }
    enter() { this.sel = 0; this.t = 0; }
    leave() {}
    onClick(p) {
      const ships = Object.keys(NS.CONFIG.ships);
      for (let i = 0; i < ships.length; i++) {
        const r = this._cardRect(i);
        if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) {
          this.sel = i; if (this._unlocked(ships[i])) this._start(ships[i]); return;
        }
      }
      const sr = this._startRect();
      if (p.x > sr.x && p.x < sr.x + sr.w && p.y > sr.y && p.y < sr.y + sr.h) this._start(ships[this.sel]);
    }
    _unlocked(k) { return this.game.save.unlocked[k]; }
    _start(ship) { if (this._unlocked(ship)) { NS.Audio.play('select'); this.game.startGame(ship); } }

    _cardRect(i) { const w = 120, h = 150, gap = 16, total = w * 3 + gap * 2; const x0 = (NS.CONFIG.canvas.width - total) / 2; return { x: x0 + i * (w + gap), y: 300, w, h }; }
    _startRect() { const w = 220, h = 48; return { x: (NS.CONFIG.canvas.width - w) / 2, y: 500, w, h }; }

    update(dt) {
      this.t += dt;
      const ships = Object.keys(NS.CONFIG.ships);
      if (NS.Input.consume('Digit1')) this.sel = 0;
      if (NS.Input.consume('Digit2')) this.sel = 1;
      if (NS.Input.consume('Digit3')) this.sel = 2;
      if (NS.Input.consume('ArrowLeft')) this.sel = (this.sel + 2) % 3;
      if (NS.Input.consume('ArrowRight')) this.sel = (this.sel + 1) % 3;
      if (NS.Input.consume('Enter') || NS.Input.consume('Space')) this._start(ships[this.sel]);
      if (NS.Input.consume('KeyM')) this.game.toggleMute();
    }
    render(ctx) {
      const W = NS.CONFIG.canvas.width;
      // Logo
      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = '#3bd6ff'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#9be7ff'; ctx.font = 'bold 44px "Segoe UI"';
      ctx.fillText('NEON STRIKE', W / 2, 120);
      ctx.shadowBlur = 8; ctx.fillStyle = '#ff5ad6'; ctx.font = '16px "Segoe UI"';
      ctx.fillText('霓 虹 突 袭', W / 2, 150);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#5a7099'; ctx.font = '12px "Segoe UI"';
      ctx.fillText('Survivor · 弹幕地狱 · Roguelike · Boss 战', W / 2, 175);
      ctx.restore();

      // 机体卡片
      const ships = Object.keys(NS.CONFIG.ships);
      for (let i = 0; i < ships.length; i++) {
        const k = ships[i]; const s = NS.CONFIG.ships[k];
        const r = this._cardRect(i);
        const sel = i === this.sel;
        const unlocked = this._unlocked(k);
        ctx.save();
        ctx.shadowBlur = sel ? 16 : 4; ctx.shadowColor = s.color;
        ctx.fillStyle = unlocked ? 'rgba(10,16,30,0.85)' : 'rgba(20,20,30,0.6)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = sel ? '#fff' : (unlocked ? s.color : '#333'); ctx.lineWidth = sel ? 2 : 1;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.shadowBlur = 0;
        // 飞船预览
        NS.Asset.drawShip(ctx, r.x + r.w / 2, r.y + 50, s.color, k, this.t * 1000);
        ctx.textAlign = 'center';
        ctx.fillStyle = unlocked ? s.color : '#555';
        ctx.font = 'bold 14px "Segoe UI"'; ctx.fillText(s.name, r.x + r.w / 2, r.y + 90);
        ctx.fillStyle = unlocked ? '#9bb3d9' : '#444'; ctx.font = '10px "Segoe UI"';
        this._wrap(ctx, s.desc, r.x + r.w / 2, r.y + 108, r.w - 12, 12);
        if (!unlocked) {
          ctx.fillStyle = '#ff8a5a'; ctx.font = '10px "Segoe UI"';
          ctx.fillText('未解锁', r.x + r.w / 2, r.y + 140);
        } else if (sel) {
          ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Segoe UI"';
          ctx.fillText('▼ 选中', r.x + r.w / 2, r.y + 140);
        }
        ctx.restore();
      }

      // 开始按钮
      const sr = this._startRect();
      const ships2 = NS.CONFIG.ships; const cur = ships2[ships[this.sel]];
      const canStart = this._unlocked(ships[this.sel]);
      ctx.save();
      ctx.shadowBlur = canStart ? 14 : 2; ctx.shadowColor = canStart ? cur.color : '#444';
      ctx.fillStyle = canStart ? 'rgba(60,120,200,0.3)' : 'rgba(40,40,55,0.5)';
      ctx.fillRect(sr.x, sr.y, sr.w, sr.h);
      ctx.strokeStyle = canStart ? cur.color : '#555'; ctx.lineWidth = 2; ctx.strokeRect(sr.x, sr.y, sr.w, sr.h);
      ctx.shadowBlur = 0; ctx.textAlign = 'center'; ctx.fillStyle = canStart ? '#fff' : '#666';
      ctx.font = 'bold 18px "Segoe UI"'; ctx.fillText('开始游戏  ▶', sr.x + sr.w / 2, sr.y + 30);
      ctx.fillStyle = '#5a7099'; ctx.font = '10px "Segoe UI"';
      ctx.fillText('WASD/方向键移动 · 空格放雷 · ESC 暂停 · M 静音', W / 2, 570);
      ctx.fillText('点击卡片选择机体 / 数字键 1·2·3', W / 2, 586);
      // 最高分
      ctx.fillStyle = '#ffd23b'; ctx.font = '12px "Segoe UI"';
      ctx.fillText(`最高分 ${this.game.save.highScore}  ·  最长存活 ${this.game.save.bestTime}s  ·  通关 ${this.game.save.wins}`, W / 2, 630);
      ctx.fillStyle = this.game.save.muted ? '#ff5a7a' : '#5a7099';
      ctx.fillText(this.game.save.muted ? '🔇 已静音 (M)' : '🔊 音效开 (M)', W / 2, 660);
      ctx.restore();
    }
    _wrap(ctx, text, x, y, maxW, lh) {
      // 简单按字符断行
      let line = ''; let yy = y;
      for (const ch of text) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, yy); line = ch; yy += lh; }
        else line = test;
      }
      ctx.fillText(line, x, yy);
    }
  }
  NS.MainMenu = MainMenu;
})(window.NS = window.NS || {});

/* ==== js/ui/Hud.js ==== */
// ui/Hud.js —— 战斗 HUD 覆盖层。由 Game 在 PLAY 场景调用 render(ctx)。
(function (NS) {
  class Hud {
    constructor(game) { this.game = game; }
    render(ctx) {
      const W = NS.CONFIG.canvas.width;
      const st = this.game.play;
      // 顶部条
      ctx.save();
      // HP
      for (let i = 0; i < st.player.maxHp; i++) {
        ctx.beginPath(); ctx.arc(20 + i * 18, 22, 6, 0, Math.PI * 2);
        ctx.fillStyle = i < st.player.hp ? '#ff3b6b' : 'rgba(255,59,107,0.2)';
        ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = i < st.player.hp ? 6 : 0; ctx.fill();
      }
      ctx.shadowBlur = 0;
      // 护盾
      for (let i = 0; i < st.player.maxShields; i++) {
        ctx.beginPath(); ctx.arc(20 + (st.player.maxHp + i) * 18, 22, 5, 0, Math.PI * 2);
        ctx.fillStyle = i < st.player.shields ? '#3bd6ff' : 'rgba(59,214,255,0.2)'; ctx.fill();
      }
      // 雷
      ctx.fillStyle = '#ffd23b'; ctx.font = 'bold 12px "Segoe UI"';
      ctx.fillText(`雷 ×${st.player.bombs}`, 20, 48);
      // 时间
      ctx.textAlign = 'center'; ctx.fillStyle = '#cfe9ff'; ctx.font = 'bold 16px "Segoe UI"';
      ctx.fillText(this._fmt(st.timeSec), W / 2, 26);
      // 分数
      ctx.fillStyle = '#ffd23b'; ctx.font = 'bold 16px "Segoe UI"';
      ctx.fillText(st.score.toString().padStart(6, '0'), W / 2, 46);
      // 连击
      if (st.combo > 1) {
        ctx.textAlign = 'right'; ctx.fillStyle = '#ff8a5a';
        ctx.font = 'bold 14px "Segoe UI"';
        ctx.fillText(`×${st.combo}  (×${st.comboMul.toFixed(1)})`, W - 14, 26);
      }
      ctx.shadowBlur = 0;

      // 经验条 + 等级
      const bw = W - 40, bh = 6;
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(20, NS.CONFIG.canvas.height - 14, bw, bh);
      ctx.fillStyle = '#3bd6ff'; ctx.fillRect(20, NS.CONFIG.canvas.height - 14, bw * st.xpProgress, bh);
      ctx.fillStyle = '#9be7ff'; ctx.font = '10px "Segoe UI"'; ctx.textAlign = 'left';
      ctx.fillText(`Lv.${st.level}`, 20, NS.CONFIG.canvas.height - 18);

      // Boss HP 条
      if (st.boss) {
        const b = st.boss; const d = b.def;
        const by = 56, bw2 = W - 40, bh2 = 8;
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(20, by, bw2, bh2);
        ctx.fillStyle = d.color; ctx.fillRect(20, by, bw2 * Math.max(0, b.hp / b.maxHp), bh2);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(20, by, bw2, bh2);
        // 阶段分段
        const list = d.final ? d.forms : d.phases;
        for (const ph of list) {
          const x = 20 + bw2 * ph.until;
          ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + bh2); ctx.strokeStyle = '#ff5a7a'; ctx.stroke();
        }
        ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Segoe UI"';
        ctx.fillText(d.name, W / 2, by - 4);
      }

      // Boss 警告
      if (st.spawner.pendingBoss && st.spawner.pendingBoss.warn > 0) {
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255,90,122,${0.5 + Math.sin(st.timeSec * 8) * 0.4})`;
        ctx.font = 'bold 28px "Segoe UI"';
        ctx.shadowColor = '#ff5a7a'; ctx.shadowBlur = 16;
        ctx.fillText('⚠  WARNING  ⚠', W / 2, NS.CONFIG.canvas.height / 2 - 40);
        ctx.shadowBlur = 0;
        ctx.font = '14px "Segoe UI"';
        ctx.fillText(NS.BOSSES[st.spawner.pendingBoss.id].name + ' 来袭', W / 2, NS.CONFIG.canvas.height / 2 - 16);
      }

      // 磁铁效果提示
      if (st.player.magnetTimer > 0) {
        ctx.fillStyle = '#ffd23b'; ctx.textAlign = 'right'; ctx.font = '10px "Segoe UI"';
        ctx.fillText(`磁吸 ${st.player.magnetTimer.toFixed(1)}s`, W - 14, NS.CONFIG.canvas.height - 18);
      }
      ctx.restore();
    }
    _fmt(s) { const m = Math.floor(s / 60), ss = Math.floor(s % 60); return `${m}:${ss.toString().padStart(2, '0')}`; }
  }
  NS.Hud = Hud;
})(window.NS = window.NS || {});

// ui/UpgradePanel.js —— 升级三选一面板。弹出时游戏暂停。
(function (NS) {
  class UpgradePanel {
    constructor(game) {
      this.game = game;
      this.choices = [];
      this.t = 0;
    }
    open(choices) { this.choices = choices; this.t = 0; }
    close() {}
    onClick(p) {
      for (let i = 0; i < this.choices.length; i++) {
        const r = this._cardRect(i);
        if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) { this._pick(i); return; }
      }
    }
    _pick(i) {
      const c = this.choices[i]; if (!c) return;
      NS.UPGRADE_POOL.apply(this.game.play.player, c);
      if (c.kind === 'evolve') { NS.Audio.play('evolve'); this.game.renderer.setFlash('#ffd23b', 200); }
      else NS.Audio.play('levelup');
      this.game.closeUpgrade();
    }
    _cardRect(i) {
      const n = this.choices.length, w = 120, h = 170, gap = 14;
      const total = w * n + gap * (n - 1);
      const x0 = (NS.CONFIG.canvas.width - total) / 2;
      return { x: x0 + i * (w + gap), y: 250, w, h };
    }
    update(dt) {
      this.t += dt;
      if (NS.Input.consume('Digit1')) this._pick(0);
      if (NS.Input.consume('Digit2')) this._pick(1);
      if (NS.Input.consume('Digit3')) this._pick(2);
      if (NS.Input.consume('ArrowLeft') || NS.Input.consume('ArrowRight')) { /* 视觉聚焦略 */ }
    }
    render(ctx) {
      const W = NS.CONFIG.canvas.width, H = NS.CONFIG.canvas.height;
      // 遮罩
      ctx.fillStyle = 'rgba(5,6,15,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.textAlign = 'center';
      ctx.shadowColor = '#ffd23b'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffd23b'; ctx.font = 'bold 26px "Segoe UI"';
      ctx.fillText('升 级', W / 2, 200);
      ctx.fillStyle = '#9bb3d9'; ctx.font = '12px "Segoe UI"'; ctx.shadowBlur = 0;
      ctx.fillText('选择一项强化 (1 · 2 · 3 或点击)', W / 2, 222);
      ctx.restore();

      for (let i = 0; i < this.choices.length; i++) {
        const c = this.choices[i]; const r = this._cardRect(i);
        const hover = Math.sin(this.t * 3 + i) * 2;
        ctx.save();
        ctx.shadowBlur = c.gold ? 18 : 8; ctx.shadowColor = c.color;
        ctx.fillStyle = c.gold ? 'rgba(40,30,5,0.9)' : 'rgba(10,16,30,0.9)';
        ctx.fillRect(r.x, r.y + hover, r.w, r.h);
        ctx.strokeStyle = c.color; ctx.lineWidth = c.gold ? 2 : 1;
        ctx.strokeRect(r.x, r.y + hover, r.w, r.h);
        ctx.shadowBlur = 0;
        // 图标圆
        ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + 40 + hover, 18, 0, Math.PI * 2);
        ctx.fillStyle = c.color; ctx.globalAlpha = 0.25; ctx.fill();
        ctx.globalAlpha = 1; ctx.strokeStyle = c.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px "Segoe UI"'; ctx.textAlign = 'center';
        ctx.fillText(c.icon, r.x + r.w / 2, r.y + 47 + hover);
        // 标题
        ctx.fillStyle = c.gold ? '#ffd23b' : '#cfe9ff'; ctx.font = 'bold 13px "Segoe UI"';
        this._wrap(ctx, c.title, r.x + r.w / 2, r.y + 78 + hover, r.w - 12, 16);
        // 描述
        ctx.fillStyle = '#9bb3d9'; ctx.font = '10px "Segoe UI"';
        this._wrap(ctx, c.desc, r.x + r.w / 2, r.y + 110 + hover, r.w - 12, 13);
        // 数字键提示
        ctx.fillStyle = '#5a7099'; ctx.font = '10px "Segoe UI"';
        ctx.fillText(`[${i + 1}]`, r.x + r.w / 2, r.y + r.h - 12 + hover);
        ctx.restore();
      }
    }
    _wrap(ctx, text, x, y, maxW, lh) {
      let line = '', yy = y;
      for (const ch of text) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, yy); line = ch; yy += lh; }
        else line = test;
      }
      ctx.fillText(line, x, yy);
    }
  }
  NS.UpgradePanel = UpgradePanel;
})(window.NS = window.NS || {});
;

// ui/PauseMenu.js —— 暂停覆盖。继续/重开/返回主菜单/静音。
(function (NS) {
  class PauseMenu {
    constructor(game) { this.game = game; this.t = 0; }
    enter() { this.t = 0; }
    leave() {}
    onClick(p) {
      const items = this._items();
      for (const it of items) if (p.x > it.x && p.x < it.x + it.w && p.y > it.y && p.y < it.y + it.h) { it.fn(); return; }
    }
    _items() {
      const W = NS.CONFIG.canvas.width, w = 220, h = 40, x = (W - w) / 2, y0 = 280;
      return [
        { x, y: y0, w, h, fn: () => this.game.resume(), label: '继续 (ESC)' },
        { x, y: y0 + 50, w, h, fn: () => this.game.restartGame(), label: '重新开始' },
        { x, y: y0 + 100, w, h, fn: () => { NS.Audio.play('select'); this.game.toMenu(); }, label: '返回主菜单' },
        { x, y: y0 + 150, w, h, fn: () => this.game.toggleMute(), label: this.game.save.muted ? '音效：关 (M)' : '音效：开 (M)' },
      ];
    }
    update(dt) {
      this.t += dt;
      if (NS.Input.consume('Escape') || NS.Input.consume('KeyP')) this.game.resume();
      if (NS.Input.consume('KeyR')) this.game.restartGame();
      if (NS.Input.consume('KeyM')) this.game.toggleMute();
    }
    render(ctx) {
      const W = NS.CONFIG.canvas.width, H = NS.CONFIG.canvas.height;
      ctx.fillStyle = 'rgba(5,6,15,0.8)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.textAlign = 'center';
      ctx.shadowColor = '#3bd6ff'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#9be7ff'; ctx.font = 'bold 30px "Segoe UI"'; ctx.fillText('暂 停', W / 2, 220);
      ctx.shadowBlur = 0;
      for (const it of this._items()) {
        ctx.fillStyle = 'rgba(30,50,80,0.4)'; ctx.fillRect(it.x, it.y, it.w, it.h);
        ctx.strokeStyle = '#3bd6ff'; ctx.lineWidth = 1; ctx.strokeRect(it.x, it.y, it.w, it.h);
        ctx.fillStyle = '#cfe9ff'; ctx.font = '14px "Segoe UI"'; ctx.fillText(it.label, it.x + it.w / 2, it.y + 25);
      }
      ctx.fillStyle = '#5a7099'; ctx.font = '10px "Segoe UI"';
      ctx.fillText('ESC/P 继续 · R 重开 · M 静音', W / 2, H - 40);
      ctx.restore();
    }
  }
  NS.PauseMenu = PauseMenu;
})(window.NS = window.NS || {});
;

// ui/GameOver.js —— 结算界面。死亡/通关均触发，显示战绩 + 解锁 + 再来一局。
(function (NS) {
  class GameOver {
    constructor(game) { this.game = game; this.t = 0; this.win = false; }
    enter(win) {
      this.win = !!win; this.t = 0; this.newRecord = false;
      const s = this.game.save;
      const st = this.game.play;
      if (st.score > s.highScore) { s.highScore = st.score; this.newRecord = true; }
      if (st.timeSec > s.bestTime) s.bestTime = Math.floor(st.timeSec);
      if (win) { s.wins = (s.wins || 0) + 1; this._checkUnlocks(); }
      NS.Storage.save(s);
      if (win) NS.Audio.play('win'); else NS.Audio.play('gameover');
    }
    leave() {}
    _checkUnlocks() {
      if (this.game.save.wins >= 1) this.game.save.unlocked.blue = true;
      if (this.game.save.wins >= 2) this.game.save.unlocked.gold = true;
    }
    onClick(p) {
      const W = NS.CONFIG.canvas.width, w = 200, h = 42, x = (W - w) / 2;
      const y1 = 430, y2 = 482;
      if (p.x > x && p.x < x + w && p.y > y1 && p.y < y1 + h) { this.game.restartGame(); return; }
      if (p.x > x && p.x < x + w && p.y > y2 && p.y < y2 + h) { this.game.toMenu(); return; }
    }
    update(dt) {
      this.t += dt;
      if (NS.Input.consume('Enter') || NS.Input.consume('KeyR')) this.game.restartGame();
      if (NS.Input.consume('Escape')) this.game.toMenu();
    }
    render(ctx) {
      const W = NS.CONFIG.canvas.width, H = NS.CONFIG.canvas.height;
      ctx.fillStyle = 'rgba(5,6,15,0.85)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.textAlign = 'center';
      const title = this.win ? '通 关' : '阵 亡';
      const tc = this.win ? '#ffd23b' : '#ff5a7a';
      ctx.shadowColor = tc; ctx.shadowBlur = 18;
      ctx.fillStyle = tc; ctx.font = 'bold 40px "Segoe UI"'; ctx.fillText(title, W / 2, 180);
      ctx.shadowBlur = 0;
      const st = this.game.play;
      ctx.fillStyle = '#cfe9ff'; ctx.font = '14px "Segoe UI"';
      const lines = [
        `分数  ${st.score}`,
        `存活  ${Math.floor(st.timeSec)}s`,
        `击杀  ${st.kills}`,
        `最高连击  ${st.maxCombo}`,
        `等级  Lv.${st.level}`,
      ];
      lines.forEach((l, i) => ctx.fillText(l, W / 2, 240 + i * 24));
      if (this.newRecord) {
        ctx.fillStyle = `rgba(255,210,59,${0.6 + Math.sin(this.t * 6) * 0.4})`;
        ctx.font = 'bold 16px "Segoe UI"'; ctx.fillText('★ 新纪录 ★', W / 2, 380);
      }
      if (this._justUnlocked()) {
        ctx.fillStyle = '#3bd6ff'; ctx.font = '12px "Segoe UI"';
        ctx.fillText('✦ 解锁新机体 ✦', W / 2, 400);
      }
      // 按钮
      const W2 = NS.CONFIG.canvas.width, w = 200, h = 42, x = (W2 - w) / 2;
      this._btn(ctx, x, 430, w, h, '再来一局 (R)', '#ff3b6b');
      this._btn(ctx, x, 482, w, h, '返回主菜单 (ESC)', '#3bd6ff');
      ctx.restore();
    }
    _justUnlocked() { return this.win && (this.game.save.wins === 1 || this.game.save.wins === 2); }
    _btn(ctx, x, y, w, h, label, color) {
      ctx.fillStyle = 'rgba(20,30,50,0.5)'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#fff'; ctx.font = '14px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.fillText(label, x + w / 2, y + 26);
    }
  }
  NS.GameOver = GameOver;
})(window.NS = window.NS || {});

/* ==== js/engine/Game.js ==== */
// engine/Game.js —— 主装配。场景管理 + 固定步长主循环 + 战斗状态 + 碰撞 + 事件。
(function (NS) {
  const SCENE = { MENU: 'menu', PLAY: 'play', UPGRADE: 'upgrade', PAUSE: 'pause', GAMEOVER: 'gameover' };
  const TAU = Math.PI * 2;
  const CFG = NS.CONFIG;

  class Game {
    constructor(canvas) {
      this.canvas = canvas;
      this.renderer = new NS.Renderer(canvas);
      NS.Input.bind(canvas);
      this.save = NS.Storage.load();
      NS.Audio.setMuted(this.save.muted);
      NS.Audio.setBeat(() => this.renderer.beat());   // BGM 节拍驱动画面脉冲

      // 池
      this.particlePool = new NS.Pool(() => new NS.Particle(), o => o.reset(), CFG.pool.particle);
      this.bulletPool = new NS.Pool(() => new NS.Bullet(), o => o.reset(), CFG.pool.bullet);

      // UI
      this.menu = new NS.MainMenu(this);
      this.hud = new NS.Hud(this);
      this.upgradePanel = new NS.UpgradePanel(this);
      this.pauseMenu = new NS.PauseMenu(this);
      this.gameOver = new NS.GameOver(this);

      // 状态
      this.scene = SCENE.MENU;
      this.play = null;
      this.lastShip = 'red';
      this.stars = this._makeStars();
      this.gridT = 0;

      this._bindEvents();
      window.addEventListener('resize', () => this.renderer.resize());
      this.canvas.addEventListener('click', (e) => this._onClick(e));

      this.menu.enter();
      this._last = performance.now();
      this._acc = 0;
      this.STEP = 1000 / 60;
      requestAnimationFrame(this._loop.bind(this));
    }

    _onClick(e) {
      const p = this.toLocal(e.clientX, e.clientY);
      if (this.scene === SCENE.MENU) this.menu.onClick(p);
      else if (this.scene === SCENE.UPGRADE) this.upgradePanel.onClick(p);
      else if (this.scene === SCENE.PAUSE) this.pauseMenu.onClick(p);
      else if (this.scene === SCENE.GAMEOVER) this.gameOver.onClick(p);
    }

    _makeStars() {
      const arr = [];
      for (let i = 0; i < CFG.render.stars; i++) {
        const layer = 1 + Math.floor(Math.random() * CFG.render.starLayers);
        arr.push({
          x: Math.random() * CFG.canvas.width,
          y: Math.random() * CFG.canvas.height,
          size: layer,
          speed: layer * 18,
          layer, color: ['#3b6bff','#5a8bff','#9be7ff'][layer - 1],
        });
      }
      return arr;
    }

    toLocal(clientX, clientY) {
      const r = this.canvas.getBoundingClientRect();
      const sx = CFG.canvas.width / r.width, sy = CFG.canvas.height / r.height;
      return { x: (clientX - r.left) * sx, y: (clientY - r.top) * sy };
    }

    // ---------- 场景切换 ----------
    startGame(ship) {
      this.lastShip = ship;
      this._initPlay(ship);
      this.scene = SCENE.PLAY;
      NS.Audio.startBgm('play');
    }
    restartGame() { this.startGame(this.lastShip); }
    toMenu() { this.scene = SCENE.MENU; this.menu.enter(); NS.Audio.startBgm('menu'); }
    resume() { if (this.scene === SCENE.PAUSE) this.scene = SCENE.PLAY; }
    toggleMute() { this.save.muted = !this.save.muted; NS.Audio.setMuted(this.save.muted); NS.Storage.save(this.save); }

    _initPlay(ship) {
      this.bulletPool.releaseAll(); this.particlePool.releaseAll();
      NS.Events.clear();
      this._bindEvents();
      const player = new NS.Player(); player.init(ship);
      this.play = {
        player, enemies: [], gems: [], pickups: [], boss: null,
        spawner: new NS.Spawner(),
        score: 0, timeSec: 0, level: 1, xp: 0, xpNeed: NS.CONFIG.xp.levelCurve(1),
        kills: 0, combo: 0, comboTimer: 0, comboMul: 1, maxCombo: 0,
        freezeTimer: 0, pendingUpgrades: 0,
      };
      this.play.xpProgress = 0;
      this.play.spawner.reset();
    }

    // ---------- 事件绑定 ----------
    _bindEvents() {
      NS.Events.on('gem.collected', g => this._onGem(g));
      NS.Events.on('pickup.collected', p => this._onPickup(p));
      NS.Events.on('enemy.killed', e => this._onEnemyKilled(e));
      NS.Events.on('player.dead', () => this._onPlayerDead());
      NS.Events.on('player.bomb', () => this._onBomb());
      NS.Events.on('player.xp', ({ amount }) => this._addXp(amount));
      NS.Events.on('score.add', n => { if (this.play) this.play.score += n; });
      NS.Events.on('bullet.spawned', b => { /* 池管理 */ });
      NS.Events.on('boss.laser', fx => { if (this.play) this.play.laserFx = { x: fx.x, y: fx.y, angle: fx.angle, life: 0.05 }; });
    }

    // ---------- 主循环 ----------
    _loop(now) {
      try {
        let dt = now - this._last; this._last = now;
        if (dt > 250) dt = 250;
        this._acc += dt;
        while (this._acc >= this.STEP) {
          this._update(this.STEP / 1000);
          this._acc -= this.STEP;
        }
        NS.Input.clearFrame();
        this._render(this._acc / this.STEP);
      } catch (e) {
        // 单帧异常不应杀死整个 RAF 链：上报后下一帧继续，保证游戏永不卡死
        console.error('[NEON STRIKE] frame error, recovering:', e);
        this._acc = 0;
      } finally {
        requestAnimationFrame(this._loop.bind(this));
      }
    }

    _update(dt) {
      this.gridT += dt * 1000;
      // 星空总在动
      if (this.scene === SCENE.MENU) { this.menu.update(dt); return; }
      if (this.scene === SCENE.GAMEOVER) { this.gameOver.update(dt); return; }
      if (this.scene === SCENE.PAUSE) { this.pauseMenu.update(dt); return; }
      if (this.scene === SCENE.UPGRADE) { this.upgradePanel.update(dt); return; }
      if (this.scene !== SCENE.PLAY) return;

      const p = this.play;
      // 暂停键
      if (NS.Input.consume('Escape') || NS.Input.consume('KeyP')) { this.scene = SCENE.PAUSE; this.pauseMenu.enter(); return; }
      // 雷
      if (NS.Input.consume('Space')) p.player.bomb(this._ctx());
      // 静音
      if (NS.Input.consume('KeyM')) this.toggleMute();

      // 冻帧
      if (p.freezeTimer > 0) { p.freezeTimer -= dt; return; }

      p.timeSec += dt;
      // 难度
      const diff = NS.getDifficulty(p.timeSec);
      const gctx = this._ctx();

      // 更新刷怪
      p.spawner.update(dt, p.timeSec, gctx);

      // 玩家
      p.player.update(dt, gctx);

      // 敌机
      for (const e of p.enemies) e.update(dt, gctx);

      // 玩家死亡则中止本帧后续逻辑
      if (p.player.dead) return;

      // Boss
      if (p.boss) p.boss.update(dt, gctx);

      // Boss 激光余辉衰减
      if (p.laserFx) { p.laserFx.life -= dt; if (p.laserFx.life <= 0) p.laserFx = null; }

      // 子弹
      this.bulletPool.forEach(b => b.update(dt, gctx));
      this.bulletPool.active.forEach(b => { if (b.dead) this.bulletPool.release(b); });

      // 宝石（磁铁时全屏吸引）
      if (p.player.magnetTimer > 0) { for (const g of p.gems) g.attracting = true; }
      for (const g of p.gems) g.update(dt, p.player);
      p.gems = p.gems.filter(g => !g.dead);

      // 道具
      for (const pk of p.pickups) pk.update(dt, p.player);
      p.pickups = p.pickups.filter(pk => !pk.dead);

      // 粒子
      this.particlePool.forEach(pa => pa.update(dt));
      this.particlePool.active.forEach(pa => { if (pa.dead) this.particlePool.release(pa); });

      // 清理死敌机
      p.enemies = p.enemies.filter(e => !e.dead);

      // 连击衰减
      if (p.comboTimer > 0) { p.comboTimer -= dt; if (p.comboTimer <= 0) { p.combo = 0; p.comboMul = 1; } }

      // 碰撞
      this._collide(dt, diff);

      // 经验进度
      p.xpProgress = Math.min(1, p.xp / p.xpNeed);

      // Boss 死亡
      if (p.boss && p.boss.dead) this._onBossDead();

      // 低血量危险警报（驱动渲染器红光脉冲）
      this.renderer.setDanger(p.player.hp <= 1);
    }

    _render(alpha) {
      const r = this.renderer, ctx = r.ctx2d;
      r.beginFrame();
      NS.Asset.drawGrid(ctx, this.gridT);
      NS.Asset.drawStars(ctx, this.stars, this.gridT);

      if (this.scene === SCENE.MENU) {
        r.endFrame(); this.menu.render(ctx); return;
      }
      if (this.scene === SCENE.GAMEOVER) {
        if (this.play) this._renderPlay(ctx);
        r.endFrame(); this.gameOver.render(ctx); return;
      }
      if (this.scene === SCENE.PAUSE) {
        if (this.play) this._renderPlay(ctx);
        r.endFrame(); this.pauseMenu.render(ctx); return;
      }
      if (this.scene === SCENE.UPGRADE) {
        if (this.play) this._renderPlay(ctx);
        r.endFrame(); this.upgradePanel.render(ctx); return;
      }
      if (this.scene === SCENE.PLAY) {
        this._renderPlay(ctx);
        this.hud.render(ctx);
        r.endFrame();
      }
    }

    _renderPlay(ctx) {
      const p = this.play;
      // 粒子（底层）
      this.particlePool.forEach(pa => pa.render(ctx));
      // 宝石
      for (const g of p.gems) g.render(ctx, this.gridT);
      // 道具
      for (const pk of p.pickups) pk.render(ctx, this.gridT);
      // 敌机
      for (const e of p.enemies) e.render(ctx, this.gridT);
      // Boss
      if (p.boss) p.boss.render(ctx, this.gridT);
      // Boss 激光束视觉
      if (p.laserFx) {
        const L = p.laserFx;
        ctx.save();
        ctx.strokeStyle = '#ff5a7a'; ctx.lineWidth = 5;
        ctx.shadowColor = '#ff5a7a'; ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(L.x, L.y);
        ctx.lineTo(L.x + Math.cos(L.angle) * 900, L.y + Math.sin(L.angle) * 900);
        ctx.stroke();
        ctx.restore();
      }
      // 子弹
      this.bulletPool.forEach(b => b.render(ctx));
      // 玩家
      if (p.player && !p.player.dead) p.player.render(ctx, this.gridT);
    }

    // ---------- spawn ctx ----------
    _ctx() {
      const g = this;
      const ctx = {
        player: g.play.player,
        addShake: n => g.renderer.addShake(n),
        setFlash: (c, ms) => g.renderer.setFlash(c, ms),
        hitStop: ms => { g.play.freezeTimer = Math.max(g.play.freezeTimer, ms / 1000); },
        spawnBullet: (x, y, vx, vy, opts) => {
          const b = g.bulletPool.acquire();
          b.x = x; b.y = y; b.vx = vx; b.vy = vy;
          Object.assign(b, opts);
          NS.Events.emit('bullet.spawned', b);
          return b;
        },
        spawn: (x, y, vx, vy, opts) => {
          // 弹幕图案专用：默认敌方子弹
          const b = g.bulletPool.acquire();
          b.x = x; b.y = y; b.vx = vx; b.vy = vy;
          Object.assign(b, { owner: 'enemy', shape: 'circle', r: 6, damage: 6, color: '#ff5a7a' }, opts);
          return b;
        },
        acquireBullet: () => g.bulletPool.acquire(),
        spawnGem: (x, y, vx, vy, kind) => {
          const gem = new NS.Gem(); gem.init(x, y, vx, vy, kind); g.play.gems.push(gem);
        },
        spawnPickup: (x, y, kind) => {
          const pk = new NS.Pickup(); pk.init(x, y, kind); g.play.pickups.push(pk);
        },
        spawnEnemy: (type, x, y) => {
          const diff = NS.getDifficulty(g.play.timeSec);
          const e = new NS.Enemy(); e.init(type, x, y, diff.hpMul); g.play.enemies.push(e);
        },
        spawnBoss: (id) => {
          const diff = NS.getDifficulty(g.play.timeSec);
          const b = new NS.Boss(); b.init(id, diff.hpMul); g.play.boss = b;
        },
        findTarget: (from) => {
          let best = null, bd = Infinity;
          for (const e of g.play.enemies) { const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2; if (d < bd) { bd = d; best = e; } }
          if (g.play.boss && !g.play.boss.dead) { const d = (g.play.boss.x - from.x) ** 2 + (g.play.boss.y - from.y) ** 2; if (d < bd) best = g.play.boss; }
          return best;
        },
        playerHurt: (dmg) => g.play.player.hurt(dmg, ctx),
      };
      return ctx;
    }

    // ---------- 碰撞 ----------
    _collide(dt, diff) {
      const p = this.play, pl = p.player;
      const cb = NS.collision.circleHit;
      // 玩家子弹 vs 敌机/Boss
      this.bulletPool.forEach(b => {
        if (b.owner !== 'player' || b.pulse) return;
        // 激光单独处理
        for (const e of p.enemies) {
          if (b.hits && b.hits.has(e)) continue;
          if (cb(b, e)) {
            let dmg = b.damage;
            const dead = e.hit(dmg);
            NS.Audio.play('hit');
            this._hitStop(NS.CONFIG.hitStop.onHit / 1000);
            this._burst(b.x, b.y, e.def.color, 6);
            b.hits.add(e);
            if (b.explodeOnHit) this._explode(b.x, b.y, b.explodeR, dmg, e.def.color);
            if (b.blast) this._blastDmg(b.x, b.y, b.blast, dmg);
            if (dead) this._killEnemy(e);
            b.pierce--;
            if (b.pierce <= 0) { b.dead = true; return; }
          }
        }
        if (p.boss && !p.boss.dead) {
          const bb = p.boss;
          if (!b.hits.has(bb) && cb(b, { x: bb.x, y: bb.y, r: bb.r })) {
            const dead = bb.hit(b.damage);
            NS.Audio.play('hit');
            this._hitStop(NS.CONFIG.hitStop.onBossHit / 1000);
            this._burst(b.x, b.y, bb.def.color, 5);
            b.hits.add(bb);
            if (b.explodeOnHit) this._explode(b.x, b.y, b.explodeR, b.damage, bb.def.color);
            if (dead) { bb.dead = true; }
            b.pierce--;
            if (b.pierce <= 0) b.dead = true;
          }
        }
      });

      // 脉冲子弹 vs 敌机（范围内）
      this.bulletPool.forEach(b => {
        if (b.owner !== 'player' || !b.pulse) return;
        for (const e of p.enemies) {
          if (Math.hypot(e.x - b.x, e.y - b.y) < b.pulseR + e.r) {
            if (!b.hits.has(e)) {
              const dead = e.hit(b.damage);
              if (b.stun) e.stun(b.stun);
              if (b.pull) { e.vx += (b.x - e.x) * 0.02; e.vy += (b.y - e.y) * 0.02; }
              b.hits.add(e);
              if (dead) this._killEnemy(e);
            }
          }
        }
      });

      // 激光束 vs 敌机（按 tick 结算，避免每帧过量伤害）
      if (pl.laserState) {
        const L = pl.laserState;
        L.tick = (L.tick || 0) + dt;
        if (L.tick >= 0.06) {
          L.tick = 0;
          for (const e of p.enemies) {
            const ex = e.x - L.x, ey = e.y - L.y;
            if (ey < 0 && Math.abs(ex) < e.r + 6 && -ey < L.len) {
              const dead = e.hit(L.damage); if (dead) this._killEnemy(e);
            }
          }
          if (p.boss && !p.boss.dead) {
            const bb = p.boss; const ex = bb.x - L.x, ey = bb.y - L.y;
            if (ey < 0 && Math.abs(ex) < bb.r + 6 && -ey < L.len) bb.hit(L.damage);
          }
        }
      }

      // 玩家刃 orbiter vs 敌机
      for (const o of pl.orbiters) {
        if (o.type !== 'blade' || o.r == null) continue;
        for (const e of p.enemies) {
          if (o.hitCd && o.hitCd.has(e)) continue;
          if (Math.hypot(o.x - e.x, o.y - e.y) < o.r + e.r) {
            const dead = e.hit(o.damage);
            if (!o.hitCd) o.hitCd = new Map();
            o.hitCd.set(e, 0.4);
            if (dead) this._killEnemy(e);
          }
        }
        if (p.boss && !p.boss.dead) {
          const bb = p.boss;
          if (Math.hypot(o.x - bb.x, o.y - bb.y) < o.r + bb.r) bb.hit(o.damage);
        }
      }
      // 刃命中冷却递减
      for (const o of pl.orbiters) {
        if (o.type !== 'blade' || !o.hitCd) continue;
        for (const [k, v] of o.hitCd) { const nv = v - 1/60; if (nv <= 0) o.hitCd.delete(k); else o.hitCd.set(k, nv); }
      }

      // 敌方子弹 vs 玩家（含擦弹）
      this.bulletPool.forEach(b => {
        if (b.owner !== 'enemy') return;
        const dx = b.x - pl.x, dy = b.y - pl.y;
        const d2 = dx * dx + dy * dy;
        const hitR2 = (pl.hitRadius + b.r) ** 2;
        if (d2 < hitR2) { pl.hurt(b.damage, this._ctx()); b.dead = true; }
        else if (!b.grazed && d2 < NS.CONFIG.graze.radius ** 2) {
          b.grazed = true;
          p.score += NS.CONFIG.graze.score;
          NS.Audio.play('graze');
          this.renderer.setFlash('#ffffff', NS.CONFIG.graze.flashMs);
        }
      });

      // 敌机本体 vs 玩家
      for (const e of p.enemies) {
        if (e.detonate) continue;
        if (cb(e, { x: pl.x, y: pl.y, r: pl.hitRadius + 2 })) { pl.hurt(1, this._ctx()); }
      }
      // Boss 本体 vs 玩家
      if (p.boss && !p.boss.dead) {
        const bb = p.boss;
        if (cb({ x: bb.x, y: bb.y, r: bb.r * 0.6 }, { x: pl.x, y: pl.y, r: pl.hitRadius })) pl.hurt(1, this._ctx());
      }

      // 兜底：Boss hp 归零即标记死亡（覆盖激光/刃/爆炸/雷等所有命中路径）
      if (p.boss && !p.boss.dead && p.boss.hp <= 0) p.boss.dead = true;
    }

    _explode(x, y, R, dmg, color) {
      for (const e of this.play.enemies) {
        if (Math.hypot(e.x - x, e.y - y) < R + e.r) { const dead = e.hit(dmg * 0.6); if (dead) this._killEnemy(e); }
      }
      this._burst(x, y, color, 16);
      this.renderer.addShake(NS.CONFIG.shake.onExplode);
    }
    _blastDmg(x, y, R, dmg) {
      for (const e of this.play.enemies) if (Math.hypot(e.x - x, e.y - y) < R + e.r) { const dead = e.hit(dmg * 0.5); if (dead) this._killEnemy(e); }
      if (this.play.boss && !this.play.boss.dead) { const b = this.play.boss; if (Math.hypot(b.x - x, b.y - y) < R + b.r) b.hit(dmg * 0.4); }
    }

    _killEnemy(e) {
      if (e.dead) return;
      e.dead = true;
      this.play.kills++;
      this.play.combo++;
      this.play.comboTimer = NS.CONFIG.combo.decayMs / 1000;
      this.play.comboMul = Math.min(NS.CONFIG.combo.maxMul, 1 + this.play.combo * NS.CONFIG.combo.perKillBonus);
      this.play.maxCombo = Math.max(this.play.maxCombo, this.play.combo);
      this.play.score += Math.floor(e.def.score * this.play.comboMul);
      NS.Dropper.drop(e.def, e.x, e.y, this._ctx());
      this._burst(e.x, e.y, e.def.color, 14);
      NS.Audio.play('kill');
      this.renderer.addShake(4);
    }

    // ---------- 事件处理 ----------
    _onGem(g) {
      const p = this.play;
      p.score += 5;
      p.xp += g.value * p.player.xpMul;
      this._checkLevel();
      NS.Audio.play('pickup');
    }
    _onPickup(pk) {
      const p = this.play;
      switch (pk.kind) {
        case 'heal': p.player.hp = Math.min(p.player.maxHp, p.player.hp + 1); NS.Audio.play('pickup'); break;
        case 'bomb': p.player.bombs++; NS.Audio.play('pickup'); break;
        case 'magnet': p.player.magnetTimer = 5; NS.Audio.play('pickup'); break;
        case 'chest': this._openUpgrade(); break;
        case 'evolve_orb': this._forceEvolve(); break;
      }
      this._burst(pk.x, pk.y, '#ffd23b', 10);
    }
    _onEnemyKilled(e) { /* 已在 _killEnemy 处理 */ }
    _onPlayerDead() {
      this.scene = SCENE.GAMEOVER;
      this.gameOver.enter(false);
      NS.Audio.startBgm('menu');
    }
    _onBomb() {
      const p = this.play;
      // 清除所有敌方子弹 + 对全屏敌机造成伤害
      this.bulletPool.forEach(b => { if (b.owner === 'enemy') b.dead = true; });
      for (const e of p.enemies) { const dead = e.hit(NS.CONFIG.bomb.damage); if (dead) this._killEnemy(e); }
      if (p.boss && !p.boss.dead) p.boss.hit(NS.CONFIG.bomb.damage);
      this._burst(p.player.x, p.player.y, '#ffd23b', 40);
    }
    _onBossDead() {
      const b = this.play.boss;
      NS.Dropper.dropBoss(b.def, b.x, b.y, this._ctx());
      this.play.score += b.def.score;
      this._burst(b.x, b.y, b.def.color, 60);
      this.renderer.addShake(NS.CONFIG.shake.onBossPhase);
      NS.Audio.play('bossExplode');
      this._hitStop(0.6);
      this.play.spawner.onBossDefeated();
      this.play.boss = null;
      if (b.def.final) {
        this.scene = SCENE.GAMEOVER; this.gameOver.enter(true); NS.Audio.play('win');
        NS.Audio.startBgm('menu');
      } else {
        NS.Audio.startBgm('play');   // Boss 战结束，BGM 回战斗鼓组
      }
    }

    _addXp(amount) {
      const p = this.play;
      p.xp += amount;
      this._checkLevel();
    }
    _checkLevel() {
      const p = this.play;
      while (p.xp >= p.xpNeed) {
        p.xp -= p.xpNeed;
        p.level++;
        p.xpNeed = NS.CONFIG.xp.levelCurve(p.level);
        p.pendingUpgrades++;
      }
      if (p.pendingUpgrades > 0 && this.scene === SCENE.PLAY) this._openUpgrade();
    }
    _openUpgrade() {
      if (this.scene !== SCENE.PLAY) return;
      const choices = NS.UPGRADE_POOL.roll(this.play.player);
      this.scene = SCENE.UPGRADE;
      this.upgradePanel.open(choices);
    }
    closeUpgrade() {
      this.upgradePanel.close();
      const p = this.play;
      p.pendingUpgrades = Math.max(0, p.pendingUpgrades - 1);
      if (p.pendingUpgrades > 0) { this._openUpgrade(); }
      else { this.scene = SCENE.PLAY; }
    }
    _forceEvolve() {
      // 找第一个可进化的武器触发
      const pl = this.play.player;
      for (const id in pl.weapons) {
        const w = pl.weapons[id]; const def = NS.WEAPONS[id];
        if (w.level >= def.maxLevel && def.evolution && !w.evolved) {
          w.evolved = true;
          NS.Audio.play('evolve');
          this.renderer.setFlash('#ffd23b', 200);
          return;
        }
      }
    }

    _burst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const p = this.particlePool.acquire();
        const a = Math.random() * TAU;
        const s = 40 + Math.random() * 200;
        p.init(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.3 + Math.random() * 0.5, color, 1 + Math.random() * 2);
      }
    }
    _hitStop(s) { if (this.play) this.play.freezeTimer = Math.max(this.play.freezeTimer, s); }
  }

  NS.Game = Game;
})(window.NS = window.NS || {});
;
/* ==== js/main.js ==== */
// main.js —— 入口。实例化 Game，首次交互解锁音频。
(function () {
  function boot() {
    const canvas = document.getElementById('game');
    const hint = document.getElementById('hint');
    const game = new NS.Game(canvas);
    window.__game = game;  // 调试用

    // 首次交互解锁 AudioContext + 隐藏提示
    const unlock = () => {
      NS.Audio.resume();
      if (hint) hint.style.display = 'none';
      window.removeEventListener('keydown', unlock);
      window.removeEventListener('click', unlock);
      window.removeEventListener('touchstart', unlock);
    };
    window.addEventListener('keydown', unlock);
    window.addEventListener('click', unlock);
    window.addEventListener('touchstart', unlock);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
;

</script>
